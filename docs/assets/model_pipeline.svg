<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#f6f8fb"/>
  
  <text x="64" y="78" font-family="Segoe UI, Arial" font-size="40" font-weight="700" fill="#0d1726">Modeling Pipeline</text>
  <text x="64" y="116" font-family="Segoe UI, Arial" font-size="19" fill="#627085">From real-source signals to sponsor recommendations</text>
<rect x="58" y="216" width="210" height="164" rx="18" fill="#0f8b6f"/><text x="80" y="274" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#fff">Real sources</text><text x="80" y="316" font-family="Segoe UI, Arial" font-size="15" fill="#eef6ff">match records, news, Wikimedia</text><path d="M280 298H332" stroke="#0d1726" stroke-width="5"/><path d="M332 298L316 288V308L332 298Z" fill="#0d1726"/><rect x="302" y="216" width="210" height="164" rx="18" fill="#2457c5"/><text x="324" y="274" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#fff">Feature store</text><text x="324" y="316" font-family="Segoe UI, Arial" font-size="15" fill="#eef6ff">FanScore, exposure, sponsor power</text><path d="M524 298H576" stroke="#0d1726" stroke-width="5"/><path d="M576 298L560 288V308L576 298Z" fill="#0d1726"/><rect x="546" y="216" width="210" height="164" rx="18" fill="#f28c28"/><text x="568" y="274" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#fff">Models</text><text x="568" y="316" font-family="Segoe UI, Arial" font-size="15" fill="#eef6ff">match probability + ROI regression</text><path d="M768 298H820" stroke="#0d1726" stroke-width="5"/><path d="M820 298L804 288V308L820 298Z" fill="#0d1726"/><rect x="790" y="216" width="210" height="164" rx="18" fill="#6d5bd0"/><text x="812" y="274" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#fff">Risk layer</text><text x="812" y="316" font-family="Segoe UI, Arial" font-size="15" fill="#eef6ff">intervals, negative ROI probability</text><path d="M1012 298H1064" stroke="#0d1726" stroke-width="5"/><path d="M1064 298L1048 288V308L1064 298Z" fill="#0d1726"/><rect x="1034" y="216" width="210" height="164" rx="18" fill="#c2415d"/><text x="1056" y="274" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#fff">Recommendations</text><text x="1056" y="316" font-family="Segoe UI, Arial" font-size="15" fill="#eef6ff">scenario ranking and actions</text><rect x="64" y="470" width="1152" height="104" rx="18" fill="#ffffff" stroke="#d7e0ea"/><text x="96" y="528" font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#0d1726">Primary target: sponsor ROI. Match probability is used as business context, not the final product.</text>
