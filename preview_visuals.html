<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldCupROI Visual Preview</title>
  <style>
    body {
      margin: 0;
      background: #eef3f2;
      color: #102033;
      font-family: Corbel, "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(1180px, calc(100vw - 48px));
      margin: 42px auto 80px;
    }
    h1 {
      font-size: 42px;
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    p {
      color: #5f7285;
      font-size: 18px;
      margin: 0 0 28px;
    }
    figure {
      margin: 0 0 34px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #d8e3e6;
      border-radius: 14px;
      box-shadow: 0 16px 42px rgba(16, 32, 51, 0.08);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    figcaption {
      margin-top: 14px;
      font-size: 16px;
      color: #405064;
    }
  </style>
</head>
<body>
<main>
  <h1>WorldCupROI Visual Preview</h1>
  <p>All visuals on this page are generated by Python scripts in the repository. Regenerate with: <code>python scripts/generate_readme_assets.py</code> and <code>python scripts/generate_model_visuals.py</code>.</p>

  <figure>
    <img src="assets/images/readme_hero.png" alt="README hero">
    <figcaption>README hero: generated by <code>scripts/generate_readme_assets.py</code> with Python + PIL.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/architecture.svg" alt="Platform architecture">
    <figcaption>Architecture: generated by <code>scripts/generate_model_visuals.py</code> as SVG.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/roi_feature_importance.svg" alt="SHAP-style ROI feature importance">
    <figcaption>SHAP-style ROI explanation: generated from <code>reports/roi_feature_importance.csv</code>.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/gnn_relationship_explainer.svg" alt="GNN relationship explanation">
    <figcaption>GNN explanation: generated by Python as a heterogeneous graph/message-passing schematic.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/data_flow.svg" alt="Data flow">
    <figcaption>Data flow: generated by Python as an academic-style data pipeline diagram.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/model_pipeline.svg" alt="Model pipeline">
    <figcaption>Model pipeline: generated by Python as a multi-stage ML architecture figure.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/scenario_ranking.svg" alt="Scenario ROI lift">
    <figcaption>Scenario ROI lift: generated from <code>data/scenario_recommendations.csv</code>.</figcaption>
  </figure>
  <figure>
    <img src="docs/assets/roi_uncertainty_intervals.svg" alt="ROI uncertainty intervals">
    <figcaption>Uncertainty intervals: generated from <code>data/roi_uncertainty.csv</code>.</figcaption>
  </figure>
</main>
</body>
</html>
